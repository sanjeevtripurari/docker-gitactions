name: Deploy Local Docker

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t my-local-app .

    - name: Stop old container
      run: |
        docker stop my-app || true
        docker rm my-app || true

    - name: Run container
      run: docker run -d -p 5000:5000 --name my-app my-local-app